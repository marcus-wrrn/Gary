; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = wroom_32_camera

[env:heltec_wifi_lora_32_V3]
platform = espressif32
board = heltec_wifi_lora_32_V3
framework = espidf
monitor_speed = 115200
build_flags = -DDEVELOPMENT=1 -DHELTEC_BOARD
; lib_deps = lvgl/lvgl@^9.5.0

[env:wroom_32_camera]
; Freenove ESP32-S3 WROOM CAM (N8R8) - see docs/freenove_esp32_s3_wroom_cam_pinout.md
platform = espressif32
board = freenove_esp32_s3_wroom
framework = espidf
monitor_speed = 115200
upload_speed = 921600
board_build.flash_mode = qio
board_build.f_flash = 80000000L
build_flags = -DDEVELOPMENT=1 -DLV_CONF_INCLUDE_SIMPLE -I${PROJECT_DIR}/include
lib_deps = lvgl/lvgl@^9.5.0
